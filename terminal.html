<!DOCTYPE html>
<html>
<head>
    <title>B.L.O.X. — Terminal</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #00ff66;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
        }

        #terminal {
            box-sizing: border-box;
            min-height: 100vh;
            padding: 25px;
            overflow-y: auto;
        }

        .line {
            margin-bottom: 7px;
            white-space: pre-wrap;
        }

        .input-line {
            display: flex;
        }

        .prompt {
            margin-right: 8px;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff66;
            font-family: Consolas, "Courier New", monospace;
            font-size: 15px;
        }

        #input::placeholder {
            color: #006b2b;
        }
    </style>
</head>

<body>

<div id="terminal">

    <div class="line">B.L.O.X. RESEARCH TERMINAL</div>
    <div class="line">--------------------------------</div>
    <div class="line">SYSTEM STATUS: ONLINE</div>
    <div class="line">ACCESS LEVEL: PUBLIC</div>
    <div class="line"></div>
    <div class="line">TYPE "HELP" FOR AVAILABLE COMMANDS.</div>
    <div class="line"></div>

    <div id="output"></div>

    <div class="input-line">
        <span class="prompt">&gt;</span>
        <input id="input" type="text" autofocus autocomplete="off" placeholder="(placeholder text)">
    </div>

</div>

<script>

const input = document.getElementById("input");
const output = document.getElementById("output");

let overrideMode = false;

function addLine(text) {

    const line = document.createElement("div");

    line.className = "line";

    line.textContent = "> " + text;

    output.appendChild(line);

    window.scrollTo(0, document.body.scrollHeight);
}

function addSystem(text) {

    const line = document.createElement("div");

    line.className = "line";

    line.textContent = text;

    output.appendChild(line);

    window.scrollTo(0, document.body.scrollHeight);
}

input.addEventListener("keydown", function(event) {

    if (event.key !== "Enter") {
        return;
    }

    const command = input.value.trim();

    if (command === "") {
        return;
    }

    addLine(command);

    input.value = "";

    /*
        HELP
    */

    if (command.toLowerCase() === "help") {

        addSystem("AVAILABLE COMMANDS:");
        addSystem("HELP");
        addSystem("STATUS");
        addSystem("CLEAR");
        addSystem("/override");

    }

    /*
        STATUS
    */

    else if (command.toLowerCase() === "status") {

        addSystem("SYSTEM: ONLINE");
        addSystem("NETWORK: CONNECTED");
        addSystem("ACCESS: PUBLIC");

        if (overrideMode) {
            addSystem("OVERRIDE: ACTIVE");
        }

    }

    /*
        CLEAR
    */

    else if (command.toLowerCase() === "clear") {

        output.innerHTML = "";

    }

    /*
        OVERRIDE
    */

    else if (command.toLowerCase() === "/override") {

        if (overrideMode) {

            addSystem("OVERRIDE ALREADY ACTIVE.");

        } else {

            addSystem("WARNING: RESTRICTED COMMAND");
            addSystem("SECURITY OVERRIDE REQUESTED.");
            addSystem("ENTER AUTHORIZATION CODE.");

            overrideMode = "waiting";

        }

    }

    /*
        AUTHORIZATION CODE
    */

    else if (overrideMode === "waiting") {

        if (command === "668876") {

            overrideMode = true;

            addSystem("AUTHORIZATION ACCEPTED.");
            addSystem("OVERRIDE CODE: 668876");
            addSystem("ACCESS LEVEL: DIRECTOR");
            addSystem("");
            addSystem("RESTRICTED ARCHIVE DIRECTORY:");
            addSystem("[01] 1997 ARCHIVE");
            addSystem("");
            addSystem("TYPE: 1997");

        } else {

            addSystem("AUTHORIZATION DENIED.");
            addSystem("INVALID CODE.");

            overrideMode = false;

        }

    }

    /*
        HIDDEN 1997 ARCHIVE
    */

    else if (
        command.toLowerCase() === "1997" &&
        overrideMode === true
    ) {

        addSystem("OPENING ARCHIVE...");
        addSystem("ARCHIVE ID: BLOX-1997");
        addSystem("ACCESS GRANTED.");

        setTimeout(function() {

            window.location.href = "1997.html";

        }, 1000);

    }

    /*
        RESTRICTED COMMANDS
    */

    else if (
        command.toLowerCase() === "1997" &&
        overrideMode !== true
    ) {

        addSystem("ACCESS DENIED.");

    }

    /*
        UNKNOWN COMMAND
    */

    else {

        addSystem("COMMAND NOT RECOGNIZED.");

    }

});

</script>

</body>
</html>
